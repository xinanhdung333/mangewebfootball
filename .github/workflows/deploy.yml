name: Deploy SportsHub

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: self-hosted
    steps:
      - name: Pull and deploy
        run: |
          cd /var/www/myapp/mangewebfootball
          for attempt in 1 2 3 4 5; do
            git pull origin main && break
            if [ "$attempt" -eq 5 ]; then
              echo "git pull failed after $attempt attempts"
              exit 1
            fi
            echo "git pull failed, retrying in 20s (attempt $attempt/5)"
            sleep 20
          done
          composer install --no-dev --optimize-autoloader --no-interaction || true
          npm install --omit=dev --no-audit --no-fund
          php artisan migrate --force || true
          php artisan config:cache || true
          php artisan route:cache || true
          php artisan view:cache || true
          sudo systemctl restart football-websocket
          curl --fail --silent http://127.0.0.1:6001/health
          sudo systemctl reload php8.5-fpm 2>/dev/null || sudo systemctl reload php8.3-fpm 2>/dev/null || true
          sudo systemctl reload nginx 2>/dev/null || true
          echo "Deployed OK $(date)"
